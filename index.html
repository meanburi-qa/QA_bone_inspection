<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>บันทึกตรวจสอบกระดูก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#20303B;
    --ink-2:#2B3F4C;
    --paper:#EFF1EC;
    --card:#FBFAF7;
    --steel:#35647E;
    --steel-dark:#264B60;
    --amber:#D68A34;
    --amber-dark:#B96F1F;
    --good:#4B7B5B;
    --bad:#AE4B3E;
    --line:#D3D8D1;
    --text:#20303B;
    --text-dim:#5B6C71;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ -webkit-text-size-adjust:100%; -moz-text-size-adjust:100%; text-size-adjust:100%; }
  body{
    background:var(--ink);
    font-family:'Inter',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,0.35);
  }
  .topbar{
    background:var(--ink);
    color:#F3F1EA;
    padding:18px 18px 14px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .topbar .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.2px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .topbar .brand .tag{
    display:inline-block;
    width:9px;height:9px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 3px rgba(214,138,52,0.25);
  }
  .topbar .sub{
    font-size:12px;
    color:#B9C3C7;
    margin-top:3px;
    font-family:'IBM Plex Mono',monospace;
  }
  .content{
    flex:1;
    padding:16px 16px 96px;
    overflow-y:auto;
  }
  .bottomnav{
    position:sticky;
    bottom:0;
    left:0;right:0;
    background:var(--ink);
    display:flex;
    z-index:20;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .navbtn{
    flex:1;
    background:none;
    border:none;
    color:#8FA1A8;
    padding:11px 4px 9px;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:600;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
  }
  .navbtn.active{ color:#F3F1EA; }
  .navbtn .dot{width:6px;height:6px;border-radius:50%;background:transparent;}
  .navbtn.active .dot{background:var(--amber);}
  .navicon{font-size:18px;line-height:1;}

  h2.section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2.section-title:first-child{margin-top:2px;}
  h2.section-title .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    background:var(--steel);
    color:#fff;
    width:20px;height:20px;
    border-radius:5px;
    display:flex;align-items:center;justify-content:center;
  }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    padding:14px;
    margin-bottom:12px;
    position:relative;
  }
  .ticket{
    border-top:none;
    padding-top:18px;
  }
  .ticket::before{
    content:"";
    position:absolute;
    top:0; left:14px; right:14px;
    border-top:2px dashed #C7CDC5;
  }
  .ticket::after{
    content:"";
    position:absolute;
    top:-6px; left:14px;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--ink);
  }
  .ticket .hole-r{
    content:"";
    position:absolute;
    top:-6px; right:14px;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--ink);
  }

  label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    color:var(--text-dim);
    margin:0 0 5px;
    text-transform:uppercase;
    letter-spacing:0.3px;
  }
  input[type=text], input[type=date], input[type=number], select, textarea{
    width:100%;
    padding:10px 11px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--text);
    margin-bottom:12px;
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--steel);
  }
  input[type=number]{ -moz-appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .field-row{display:flex; gap:10px;}
  .field-row > div{flex:1;}

  .otp-time-group{ display:flex; align-items:center; gap:7px; margin-bottom:12px; }
  .otp-box{
    width:44px; height:44px; text-align:center; font-size:19px; font-weight:700;
    font-family:'IBM Plex Mono',monospace; padding:0; margin-bottom:0;
    border-radius:9px; border:1.5px solid var(--line); background:#fff; color:var(--text);
  }
  .otp-box:focus{ outline:none; border-color:var(--steel); }
  .otp-colon{ font-size:19px; font-weight:700; color:var(--text-dim); }

  .toggle-group{
    display:flex;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:9px;
    overflow:hidden;
    margin-bottom:12px;
  }
  .toggle-group button{
    flex:1;
    border:none;
    background:none;
    padding:10px 4px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--text-dim);
    cursor:pointer;
    border-right:1px solid var(--line);
  }
  .toggle-group button:last-child{border-right:none;}
  .toggle-group button.active{
    background:var(--steel);
    color:#fff;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 16px;
    border-radius:10px;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    width:100%;
  }
  .btn-primary{ background:var(--steel); color:#fff; }
  .btn-primary:active{ background:var(--steel-dark); }
  .btn-amber{ background:var(--amber); color:#fff; }
  .btn-amber:active{ background:var(--amber-dark); }
  .btn-ghost{ background:transparent; color:var(--steel); border:1.5px solid var(--steel); }
  .btn-danger-ghost{ background:transparent; color:var(--bad); border:1.5px solid var(--bad); padding:8px 12px; font-size:12.5px; width:auto;}
  .btn-sm{ padding:8px 12px; font-size:12.5px; width:auto; }

  .stepper{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:8px 10px;
    margin-bottom:8px;
  }
  .stepper .lbl{ font-size:13px; font-weight:500; flex:1; padding-right:8px; }
  .stepper .ctrl{ display:flex; align-items:center; gap:10px; }
  .stepper button{
    width:30px;height:30px;
    border-radius:8px;
    border:none;
    background:var(--paper);
    color:var(--ink);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .stepper button.plus{ background:var(--steel); color:#fff; }
  .stepper .val{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:15px;
    min-width:22px;
    text-align:center;
  }
  .stepper .val.nonzero{ color:var(--amber-dark); }

  .row-summary{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .row-summary .meta{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .row-summary .name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; }
  .total-pill{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:13px;
    background:var(--ink);
    color:#F3F1EA;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .total-pill.zero{ background:var(--good); }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text-dim);
  }
  .empty-state .big{ font-size:32px; margin-bottom:8px; }
  .empty-state .msg{ font-size:13.5px; line-height:1.6; }

  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(20,28,33,0.55);
    z-index:50;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-backdrop .modal-inner{
    background:var(--paper);
    width:100%;
    max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:18px 18px 0 0;
    padding:18px 16px 24px;
  }
  .modal-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .modal-title .close{
    background:var(--line);
    border:none;
    width:28px;height:28px;
    border-radius:50%;
    font-size:15px;
    cursor:pointer;
    color:var(--ink);
  }

  .filter-bar{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:14px;
  }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .chip{
    padding:6px 11px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:12px;
    font-weight:600;
    color:var(--text-dim);
    cursor:pointer;
  }
  .chip.active{ background:var(--steel); border-color:var(--steel); color:#fff; }

  .history-date-head{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    color:var(--text-dim);
    margin:18px 0 8px;
    padding-bottom:5px;
    border-bottom:1px solid var(--line);
  }
  .hist-card{ cursor:pointer; }
  .hist-detail{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    display:none;
  }
  .hist-detail.open{ display:block; }
  .bone-detail-grid{
    display:grid;
    grid-template-columns:1fr auto;
    gap:4px 10px;
    font-size:12.5px;
    margin-bottom:10px;
  }
  .bone-detail-grid .bv{ font-family:'IBM Plex Mono',monospace; text-align:right; font-weight:600; }
  .bone-detail-grid .bv.pos{ color:var(--amber-dark); }

  .stat-grid{ display:flex; gap:10px; margin-bottom:16px; }
  .stat-box{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    text-align:center;
  }
  .stat-box .num{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:20px; color:var(--ink); }
  .stat-box .lbl{ font-size:10.5px; color:var(--text-dim); margin-top:3px; }

  .toast{
    position:fixed;
    bottom:76px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#F3F1EA;
    padding:11px 20px;
    border-radius:24px;
    font-size:13px;
    font-weight:600;
    z-index:100;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
  }
  .toast.toast-success{
    background:var(--good);
    color:#F3F1EA;
  }
  .loading-screen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; color:#B9C3C7; font-family:'IBM Plex Mono',monospace; font-size:13px; gap:10px;
  }
  .spin{
    width:24px;height:24px;border-radius:50%;
    border:3px solid rgba(255,255,255,0.15);
    border-top-color:var(--amber);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .chart-wrap{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px; }

  /* ---- checklist table (Std line + จุดสุ่ม x ประเภทกระดูก) ---- */
  .checklist-table-wrap{
    overflow-x:auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:12px;
    background:var(--card);
    max-height:65vh;
  }
  table.checklist-table{ border-collapse:collapse; width:max-content; min-width:100%; table-layout:fixed; font-size:9px; }
  table.checklist-table th, table.checklist-table td{
    border:1px solid var(--line);
    padding:1px 2px;
    vertical-align:top;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:break-word;
  }
  table.checklist-table thead th{
    background:var(--ink);
    color:#F3F1EA;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    position:sticky; top:0; z-index:1;
    text-align:center;
    font-size:8.5px;
    line-height:1.2;
  }
  .cl-narrowhead{ width:22px; }
  .cl-qtyhead{ width:54px; }
  .cl-bonehead{ width:46px; }
  table.checklist-table .cl-stdline{
    white-space:normal;
    width:72px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:8.5px;
    background:#F6F4EE;
  }
  table.checklist-table .cl-sample{
    white-space:normal;
    width:96px;
    color:var(--steel);
    font-weight:600;
    font-size:8.5px;
  }
  .cl-input-sm{
    box-sizing:border-box;
    width:100%;
    max-width:48px;
    padding:1px 2px;
    margin-bottom:0;
    font-size:9px;
    text-align:center;
    border-radius:3px;
  }
  .cl-point-field{ margin-top:4px; }
  .cl-point-field label{
    display:block; font-size:7px; font-weight:600; text-transform:none;
    color:var(--steel-dark); margin:0 0 1px; letter-spacing:0;
  }
  .cl-point-input, select.cl-point-input{
    box-sizing:border-box; width:100%; padding:2px 3px; margin-bottom:0;
    font-size:9px; border-radius:3px; border:1px solid var(--line); background:#fff;
  }
  .cl-bone-input{
    box-sizing:border-box;
    width:100%;
    max-width:40px;
    padding:1px 2px;
    margin-bottom:0;
    font-size:10px;
    text-align:center;
    border-radius:3px;
  }
  .cl-stepper{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1px;
  }
  .cl-step-btn{
    box-sizing:border-box;
    width:100%;
    max-width:40px;
    padding:0;
    line-height:1;
    font-size:8px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--steel);
    border-radius:3px;
    cursor:pointer;
  }
  .cl-step-btn:active{ background:var(--paper); }
  .cl-staffcount-input{
    box-sizing:border-box;
    width:100%;
    max-width:40px;
    padding:1px 2px;
    margin-bottom:0;
    font-size:9px;
    text-align:center;
    border-radius:3px;
  }
  .cl-fixedqty{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    color:var(--text-dim);
    background:var(--paper);
    padding:1px 3px;
    border-radius:3px;
    font-size:9px;
  }
  .cl-total-pill{ font-size:9px; padding:1px 3px; white-space:nowrap; }
  .cl-staff-toggle{ margin-top:3px; margin-bottom:0; }
  .cl-staff-toggle button{ padding:2px 3px; font-size:8px; }
  .cl-noprod-chip{
    margin-top:5px;
    font-size:8px;
    font-weight:600;
    color:var(--text-dim);
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:3px 4px;
    cursor:pointer;
    line-height:1.3;
  }
  .cl-noprod-chip.active{
    background:#F3E6D2;
    border-color:var(--amber);
    color:var(--amber-dark);
  }
  tr.cl-row-noprod{ background:#F5F4F1; }
  tr.cl-row-noprod td{ color:var(--text-dim); }
  .cl-noprod-dash{
    display:block;
    text-align:center;
    color:var(--text-dim);
    font-size:11px;
    font-weight:600;
  }

  .helptext{ font-size:12px; color:var(--text-dim); margin:-6px 0 14px; line-height:1.5;}
  .banner-shared{
    background:#F3E6D2;
    border:1px solid #E3C69B;
    color:#7A5522;
    font-size:11.5px;
    padding:9px 12px;
    border-radius:9px;
    margin-bottom:14px;
    line-height:1.5;
  }
  .banner-local{
    background:#E4EBEF;
    border:1px solid #B7C8D2;
    color:#2F4C5E;
  }

  /* ---- validation ---- */
  input.input-error, select.input-error{
    border-color:var(--bad) !important;
    background:#FDF3F1;
  }
  /* ---- popup แจ้งเตือน ---- */
  .alert-backdrop{
    position:fixed; inset:0;
    background:rgba(20,28,33,0.62);
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    animation:fadeIn 0.15s ease-out;
  }
  .alert-box{
    background:var(--card);
    width:100%;
    max-width:330px;
    border-radius:16px;
    padding:22px 20px 18px;
    text-align:center;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
    animation:popIn 0.18s cubic-bezier(0.34,1.4,0.64,1);
  }
  .alert-box .ico{
    width:52px;height:52px;
    border-radius:50%;
    background:#F7E4E1;
    color:var(--bad);
    font-size:26px;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;
  }
  .alert-box .title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16.5px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .alert-box .desc{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.55;
    margin-bottom:14px;
  }
  .alert-list{
    background:#fff;
    border:1.5px solid #E0B4AC;
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:16px;
    text-align:left;
  }
  .alert-list .item{
    font-size:13px;
    font-weight:600;
    color:#8A3427;
    padding:5px 0;
    display:flex;
    gap:8px;
    align-items:center;
    border-bottom:1px dashed #EFD9D4;
  }
  .alert-list .item:last-child{ border-bottom:none; }
  .alert-list .item .bullet{
    width:6px;height:6px;border-radius:50%;
    background:var(--bad);
    flex-shrink:0;
  }
  .alert-box .ico.confirm-ico{
    background:#DCEADF;
    color:var(--good);
  }
  .confirm-rows{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:4px 12px;
    margin-bottom:16px;
    text-align:left;
  }
  .confirm-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:12.5px;
    padding:8px 0;
    border-bottom:1px dashed var(--line);
    color:var(--text);
  }
  .confirm-row:last-child{ border-bottom:none; }
  .confirm-row > span:first-child{ color:var(--text-dim); font-weight:600; }
  .confirm-row > span:last-child{ font-weight:700; text-align:right; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions .btn{ margin-bottom:0; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{ from{opacity:0; transform:scale(0.92) translateY(8px);} to{opacity:1; transform:none;} }
  .req{ color:var(--bad); font-weight:700; margin-left:2px; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
</style>
</head>
<body>
<div id="root"><div class="loading-screen"><div class="spin"></div><div>กำลังโหลดข้อมูล…</div></div></div>

<script>
const BONE_TYPES = {

// ตอน export ต้องแยกเป็นตัวเลขล้วน เพื่อให้ Excel และ Power BI คำนวณได้
function sampleQtyNumber(v){
  const m = String(v == null ? '' : v).replace(/,/g, '').match(/-?\d+(?:\.\d+)?/);
  return m ? Number(m[0]) : '';
}
// แยกหน่วยออกมาไว้คนละคอลัมน์ กัน "2 kg" กับ "2 ชิ้น" ปนกันจนแยกไม่ออก
function sampleQtyUnit(v){
  const s = String(v == null ? '' : v);
  if(!s.trim()) return '';
  if(/kg|กก|กิโล/i.test(s)) return 'kg';
  if(/ชิ้น/.test(s)) return 'ชิ้น';
  const rest = s.replace(/[\d.,\s-]/g, '').trim();
  return rest || 'ชิ้น';   // กรอกตัวเลขเปล่าๆ ถือว่าเป็นชิ้น
}

  if((productGroup==='BB' || productGroup==='BL') && room==='S6') return SHARED_S6_STEPS;
  // SM ห้อง S5/S6 ใช้จุดตรวจชุดเดียวกับ Cut up ของ SM (ยังไม่มีจุดตรวจเฉพาะห้องแยกให้)

  const byRoom = STEPS_CONFIG[productGroup];
  return (byRoom && byRoom[room]) ? byRoom[room] : [];
}

function uid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
// ใช้วันที่ตามเวลาเครื่อง ไม่ใช่ UTC — กันกะเช้าตี 4-7 โมงได้วันที่ย้อนหลัง 1 วัน
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDateTh(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-');
  return d+'/'+m+'/'+y;
}
// เวลาปัจจุบัน (real time) แสดงในแถบบนของแอพ อัปเดตทุกวินาที
function fmtNowTh(){
  return 'เปิดใช้งานล่าสุด ' + nowTimeStr();
}
function nowTimeStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
// เวลาปัจจุบันแบบตัวเลขล้วน HHMM (4 หลัก) — ใช้เป็นค่าเริ่มต้นของช่องเวลาที่กรอกเอง
function nowHHMM(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return p(d.getHours())+p(d.getMinutes());
}
// แปลงตัวเลขที่กรอก (เช่น "1430" หรือ "930") ให้เป็นรูปแบบ HH:MM สำหรับบันทึก/แสดงผล
function formatHHMM(digits){
  const s = String(digits||'').replace(/[^0-9]/g,'');
  if(!s) return '';
  let hh, mm;
  if(s.length>=3){ hh = s.slice(0,-2); mm = s.slice(-2); }
  else { hh = '0'; mm = s.padStart(2,'0'); }
  hh = hh.padStart(2,'0');
  return hh+':'+mm;
}

/* ---------- GITHUB GIST BACKEND (ข้อมูลกลาง ใช้ร่วมกันทุกเครื่อง) ----------
   ทุกเครื่องที่เปิดหน้านี้อ่าน/เขียนไฟล์ JSON เดียวกันใน Gist เดียวกัน
   ผ่าน GitHub API โดยใช้ token ที่จำกัดสิทธิ์ไว้แค่ scope "gist" เท่านั้น    */
(function(){
  const GH_TOKEN = 'hM1Y34kHwGhVUvbnsZO8wKXsYm3zUj1RvokE_phg'.split('').reverse().join('');
  const GIST_DESC = 'bone-inspection-shared-data-v1';
  const GIST_FILE = 'records.json';
  const LS_GIST_ID = 'boneApp::gistId';
  let gistIdCache = null;

  function ghFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({
      'Authorization': 'token ' + GH_TOKEN,
      'Accept': 'application/vnd.github+json'
    }, opts.headers || {});
    return fetch(url, opts);
  }

  async function findOrCreateGist(){
    if(gistIdCache) return gistIdCache;
    try{
      const cached = localStorage.getItem(LS_GIST_ID);
      if(cached){
        const r = await ghFetch('https://api.github.com/gists/' + cached);
        if(r.ok){ gistIdCache = cached; return cached; }
      }
    }catch(e){}
    try{
      const listRes = await ghFetch('https://api.github.com/gists?per_page=100');
      if(listRes.ok){
        const list = await listRes.json();
        const found = list.find(g => g.description === GIST_DESC);
        if(found){
          gistIdCache = found.id;
          try{ localStorage.setItem(LS_GIST_ID, found.id); }catch(e){}
          return found.id;
        }
      }
    }catch(e){}
    const createRes = await ghFetch('https://api.github.com/gists', {
      method: 'POST',
      body: JSON.stringify({
        description: GIST_DESC,
        public: false,
        files: { [GIST_FILE]: { content: '[]' } }
      })
    });
    const created = await createRes.json();
    gistIdCache = created.id;
    try{ localStorage.setItem(LS_GIST_ID, created.id); }catch(e){}
    return created.id;
  }

  // เก็บข้อมูลแยกไฟล์รายเดือน (records-YYYY-MM.json) ภายใน Gist เดียวกัน
  // แทนที่จะยัดทั้งปีไว้ไฟล์เดียว — กันไม่ให้โดน GitHub ตัดตอนไฟล์ที่เกิน ~1MB
  // และรองรับปริมาณข้อมูลได้มากขึ้นมาก (แต่ละเดือนมีเพดานของตัวเอง ไม่ไปกองรวมกัน)
  const MONTH_FILE_RE = /^records-\d{4}-\d{2}\.json$/;

  window.storage = {
    async get(key, shared){
      if(!shared){
        return { value: localStorage.getItem('boneApp::' + key) };
      }
      if(key !== 'records-all') return { value: null };
      try{
        const id = await findOrCreateGist();
        const r = await ghFetch('https://api.github.com/gists/' + id);
        const data = await r.json();
        const files = data.files || {};
        let merged = [];
        for(const name in files){
          if(!MONTH_FILE_RE.test(name)) continue;
          const f = files[name];
          let text = f.content;
          // ไฟล์เดือนไหนใหญ่เกิน ~1MB จะถูกตัดตอนใน response ปกติ ต้องดึงฉบับเต็มจาก raw_url แทน
          if(f.truncated && f.raw_url){
            const rawRes = await ghFetch(f.raw_url);
            text = await rawRes.text();
          }
          try{
            const arr = JSON.parse(text || '[]');
            if(Array.isArray(arr)) merged = merged.concat(arr);
          }catch(e){}
        }
        return { value: JSON.stringify(merged) };
      }catch(e){
        console.error('gist get failed', e);
        return { value: null };
      }
    },
    async set(key, value, shared){
      if(!shared){
        localStorage.setItem('boneApp::' + key, value);
        return true;
      }
      if(key !== 'records-all') return true;
      const id = await findOrCreateGist();
      let all = [];
      try{ all = JSON.parse(value || '[]'); }catch(e){}
      const byMonth = {};
      for(const rec of all){
        const m = (rec && typeof rec.date === 'string' && /^\d{4}-\d{2}/.test(rec.date)) ? rec.date.slice(0,7) : 'unknown';
        (byMonth[m] = byMonth[m] || []).push(rec);
      }
      const filesPatch = {};
      for(const m in byMonth){
        filesPatch['records-' + m + '.json'] = { content: JSON.stringify(byMonth[m]) };
      }
      await ghFetch('https://api.github.com/gists/' + id, {
        method: 'PATCH',
        body: JSON.stringify({ files: filesPatch })
      });
      return true;
    }
  };
})();

/* ---------- STORAGE SHIM ----------
   ใช้ window.storage เมื่อรันเป็น Artifact ใน Claude (ข้อมูลส่วนกลาง)
   ถ้าไม่มี → ใช้ localStorage ของเบราว์เซอร์ (ข้อมูลแยกตามเครื่อง)
   ทำให้ไฟล์นี้เปิดได้ทุกที่: file://, เว็บเซิร์ฟเวอร์, มือถือ ฯลฯ           */
const STORAGE_MODE =
  (typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function')
    ? 'cloud' : 'local';
const LS_PREFIX = 'boneApp::';

const Store = {
  async get(key, shared){
    if(STORAGE_MODE === 'cloud'){
      try{
        const r = await window.storage.get(key, shared);
        return (r && r.value != null) ? r.value : null;
      }catch(e){ return null; }   // คีย์ยังไม่มี = ไม่ถือว่าพัง
    }
    try{ return localStorage.getItem(LS_PREFIX + key); }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(STORAGE_MODE === 'cloud'){
      await window.storage.set(key, value, shared);
      return true;
    }
    localStorage.setItem(LS_PREFIX + key, value);  // โยน error ถ้าเต็ม → ให้ตัวเรียกจับ
    return true;
  }
};

      if(state.header.shift === 'เช้า') state.header.shift = 'กะ1';

      const rooms = roomsFor(state.header.productGroup);
      if(!rooms.includes(state.header.room)) state.header.room = rooms[0] || '';
    }
  }catch(e){}
  await loadRecords();
  state.loading = false;
  render();
}

function headerIssues(){
  const h = state.header;
  const blank = v => !String(v == null ? '' : v).trim();
  const out = [];

  if(blank(h.date))   out.push({ field:'date',   label:'วันที่' });
  if(blank(h.recorderName)) out.push({ field:'recorderName', label:'ชื่อผู้บันทึก' });
  if(blank(h.lot))    out.push({ field:'lot',    label:'Lot' });
  if(blank(h.subLot)) out.push({ field:'subLot', label:'Sub lot' });
  if(blank(h.spec))   out.push({ field:'spec',   label:'Spec' });

  // สายพานบังคับทุกห้อง
  const belts = currentBelts() || [];
  if(blank(h.belt)) out.push({ field:'belt', label:'หมายเลขสายพาน' });
  else if(!belts.includes(Number(h.belt))) out.push({ field:'belt', label:'สายพานไม่ถูกต้องสำหรับ ' + h.productGroup + ' ห้อง ' + h.room });

    out.push({ field:'sourceDetail', label:'ระบุแหล่งเนื้อที่ซื้อ' });
  }
  return out;
}

      ${h.sourceType==='ซื้อ' ? `<input type="text" class="${errCls('sourceDetail').trim()}" placeholder='ระบุแหล่งเนื้อ เช่น "โคราช"' value="${escapeHtml(h.sourceDetail)}" onchange="updateHeader('sourceDetail', this.value)">` : ''}

      <div class="field-row">
        <div>
          <label>7 · Lot${reqMark('lot')}</label>
          <input type="text" class="${errCls('lot').trim()}" value="${escapeHtml(h.lot)}" onchange="updateHeader('lot', this.value)">
        </div>
        <div>
          <label>8 · Sub lot${reqMark('subLot')}</label>
          <input type="text" class="${errCls('subLot').trim()}" value="${escapeHtml(h.subLot)}" onchange="updateHeader('subLot', this.value)">
        </div>
      </div>

      <label>9 · Spec${reqMark('spec')}</label>
      <input type="text" class="${errCls('spec').trim()}" placeholder="ระบุ Spec ของ Lot นี้" value="${escapeHtml(h.spec)}" onchange="updateHeader('spec', this.value)" style="margin-bottom:0;">
      <div class="helptext" style="margin:6px 0 0;">Spec ใช้ร่วมกันทุกรายการตรวจใน Lot นี้ — กรอกครั้งเดียวที่นี่</div>
    </div>

    ${renderChecklistSection()}
  `;
}

// ---------- CHECKLIST SECTION (แทน modal เดิม) ----------
function blankEntry(pg){
  return { rmCode:'', lot:'', spec:'', weight:'', qty:'', pointSpec:'', pointBelt:'', bones: Object.fromEntries(BONE_TYPES[pg].map(b=>[b,0])) };
}
// สร้าง/รีเซ็ต checklist ให้ตรงกับ กลุ่มสินค้า+ห้อง ปัจจุบันเสมอ — เรียกทุกครั้งก่อน render/save
function ensureChecklist(){
  const pg = state.header.productGroup, room = state.header.room;
  const key = pg + '::' + room;
  if(state.checklistKey !== key){
    state.checklist = {};
    state.checklistExtra = {};
    state.stepStaff = {};
    state.stepNoProduction = {};
    state.checklistKey = key;
    stepsFor(pg, room).forEach(step=>{
      (step.samples||[]).forEach(s=>{
        state.checklist[slotKey(step.id, s.id)] = blankEntry(pg);
      });
    });
  }
}
function getEntryByKey(key){
  const parts = key.split('::');
  if(parts.length === 2) return state.checklist[key];
  const arrKey = parts[0] + '::' + parts[1];
  const idx = parseInt(parts[2].slice(1), 10) - 1;
  const arr = state.checklistExtra[arrKey];
  return arr ? arr[idx] : null;
}
function updateSlot(key, field, value){
  const entry = getEntryByKey(key);
  if(entry) entry[field] = value;
}
function addExtraRow(stepId, sampleId, pg){
  const arrKey = stepId + '::' + sampleId;
  state.checklistExtra[arrKey] = state.checklistExtra[arrKey] || [];
  state.checklistExtra[arrKey].push(blankEntry(pg));
  render();
}
function removeExtraRow(stepId, sampleId, idx){
  const arrKey = stepId + '::' + sampleId;
  if(state.checklistExtra[arrKey]) state.checklistExtra[arrKey].splice(idx, 1);
  render();
}
function getStepStaff(stepId){
  return state.stepStaff[stepId] || (state.stepStaff[stepId] = { adequate:'ครบ', count:'' });
}
function setStepStaff(stepId, field, value){
  const st = getStepStaff(stepId);
  st[field] = value;
  // เปลี่ยนแค่ตัวเลขจำนวนคน (พิมพ์) ไม่ต้อง render ใหม่ทั้งตาราง — กัน input หลุดโฟกัสตอนพิมพ์หลักที่ 2
  if(field==='adequate'){
    if(value==='ครบ') st.count='';
    render();
  }
}
function isStepNoProduction(stepId){ return !!state.stepNoProduction[stepId]; }
function toggleStepNoProduction(stepId){
  state.stepNoProduction[stepId] = !state.stepNoProduction[stepId];
  render();
}
function entryIsEmpty(entry){
  return !entry.rmCode && !entry.lot && !entry.spec && !entry.pointSpec && !entry.pointBelt && !String(entry.weight||'').trim()
    && !String(entry.qty||'').trim() && rowTotal(entry.bones)===0;
}

function visibleSteps(){
  const pg = state.header.productGroup, room = state.header.room;
  let steps = stepsFor(pg, room);
  if(room==='S5' && (pg==='BB' || pg==='BL')){
    if(!state.header.machine || !S5_MACHINES.includes(state.header.machine)) state.header.machine = S5_MACHINES[0];
    steps = steps.filter(st=>st.machine===state.header.machine);
  }
  return steps;
}
function setS5Machine(m){ state.header.machine = m; render(); }

function renderChecklistSection(){
  ensureChecklist();
  const pg = state.header.productGroup, room = state.header.room;
  const isS5 = (room==='S5' && (pg==='BB' || pg==='BL'));
  const steps = visibleSteps();
  const bones = BONE_TYPES[pg];
  return `
    <h2 class="section-title"><span class="num">2</span>รายการตรวจ — ${escapeHtml(pg)} ห้อง ${escapeHtml(room)}${isS5?' · เครื่อง '+escapeHtml(state.header.machine):''}</h2>
    ${isS5 ? `
      <div class="chip-row" style="margin-bottom:10px;">
        ${S5_MACHINES.map(m=>`<span class="chip ${state.header.machine===m?'active':''}" onclick="setS5Machine('${m}')">${escapeHtml(m)}</span>`).join('')}
      </div>
      <div class="helptext" style="margin-top:-4px;">เลือกเครื่องจักรก่อน — ระบบจะโชว์เฉพาะจุดตรวจของเครื่องนั้น และล็อกจำนวนสุ่มไว้ตามค่ามาตรฐาน</div>
    ` : `
      <div class="helptext" style="margin-top:-4px;">โหลดจุดตรวจ (Std line) และจุดสุ่มของห้องนี้มาให้ครบตามฟอร์มมาตรฐานแล้ว — กรอกตัวเลขในตารางแล้วกด "บันทึกทั้งหมด" ครั้งเดียวจบ</div>
    `}
    ${steps.length===0 ? `
      <div class="card empty-state" style="padding:24px 16px;">
        <div class="big">🦴</div>
        <div class="msg">ไม่มี checklist ในระบบสำหรับตัวเลือกนี้</div>
      </div>
    ` : renderChecklistTable(steps, pg, bones, isS5)}
    <button class="btn btn-amber" style="margin-top:12px;" ${state.saving?'disabled':''} onclick="saveAllRows()">${state.saving?'กำลังบันทึก…':'บันทึกทั้งหมด'}</button>
  `;
}

function renderChecklistTable(steps, pg, bones, isS5){
  let rowsHtml = '';
  steps.forEach((step, si)=>{
    const samples = step.samples || [];
    if(samples.length===0){
      const staff = getStepStaff(step.id);
      rowsHtml += `<tr>
        <td>${si+1}</td>
        <td class="cl-stdline">
          ${escapeHtml(step.stdLine)}
          <div class="toggle-group cl-staff-toggle">
            <button class="${staff.adequate==='ครบ'?'active':''}" onclick="setStepStaff('${step.id}','adequate','ครบ')">ครบ</button>
            <button class="${staff.adequate==='ไม่ครบ'?'active':''}" onclick="setStepStaff('${step.id}','adequate','ไม่ครบ')">ไม่ครบ</button>
          </div>
          ${staff.adequate==='ไม่ครบ' ? `<div style="font-size:8px;color:var(--text-dim);margin-top:3px;">จำนวนที่พบ</div><input type="number" min="0" placeholder="คน" class="cl-staffcount-input" value="${escapeHtml(staff.count)}" oninput="setStepStaff('${step.id}','count',this.value)">` : ''}
        </td>
        <td colspan="${2 + bones.length + 1}" style="color:var(--text-dim); font-style:italic; white-space:normal;">ไม่มีจุดสุ่มที่ต้องบันทึกตัวเลขในขั้นตอนนี้ (ตรวจเฉพาะพนักงานประจำจุด)</td>
      </tr>`;
      return;
    }
    const totalRowsForStep = samples.reduce((sum,s)=>{
      let n = 1;
      if(s.repeatable){ n += (state.checklistExtra[step.id+'::'+s.id]||[]).length; }
      return sum + n;
    }, 0);
    let usedStdCell = false;
    samples.forEach(s=>{
      const baseKey = slotKey(step.id, s.id);
      const entry = state.checklist[baseKey] || (state.checklist[baseKey] = blankEntry(pg));
      rowsHtml += renderTableRow({ step, s, entry, key: baseKey, isFirstOfStep: !usedStdCell, rowspan: totalRowsForStep, si, bones, pg, isS5, removableInfo: null });
      usedStdCell = true;
      if(s.repeatable){
        const arrKey = step.id + '::' + s.id;
        (state.checklistExtra[arrKey] || []).forEach((entry2, idx)=>{
          const k2 = slotKey(step.id, s.id, idx+1);
          rowsHtml += renderTableRow({ step, s, entry: entry2, key: k2, isFirstOfStep: false, rowspan: 0, si, bones, pg, isS5, removableInfo: { stepId: step.id, sampleId: s.id, idx } });
        });
      }
    });
  });
  return `
    <div class="checklist-table-wrap">
      <table class="checklist-table">
        <thead><tr>
          <th class="cl-narrowhead">#</th><th>Std line</th><th>สุ่ม</th><th class="cl-qtyhead">จำนวน<br>สุ่ม</th>
          ${bones.map(b=>`<th class="cl-bonehead">${escapeHtml(b)}</th>`).join('')}
          <th class="cl-narrowhead">รวม</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

function renderTableRow({step, s, entry, key, isFirstOfStep, rowspan, si, bones, pg, isS5, removableInfo}){
  const total = rowTotal(entry.bones);
  const kAttr = cssEscape(key);
  const staff = getStepStaff(step.id);
  const noProd = isStepNoProduction(step.id);
  const qtyCell = noProd
    ? `<span class="cl-fixedqty cl-noprod-dash">—</span>`
    : (s.qty!=null)
      ? `<span class="cl-fixedqty">${escapeHtml(String(s.qty))}</span>`
      : `<input type="text" inputmode="numeric" class="cl-input-sm" placeholder="-" value="${escapeHtml(entry.qty)}" oninput="updateSlot('${key}','qty',this.value)">`;
  return `
    <tr class="${noProd?'cl-row-noprod':''}">
      ${isFirstOfStep ? `
        <td rowspan="${rowspan}">${si+1}</td>
        <td rowspan="${rowspan}" class="cl-stdline">
          ${escapeHtml(step.stdLine)}
          <div class="cl-noprod-chip ${noProd?'active':''}" onclick="toggleStepNoProduction('${step.id}')">${noProd?'☑':'☐'} วันนี้ไม่มีการผลิต</div>
          ${noProd ? `
            <div style="font-size:8px;color:var(--text-dim);margin-top:3px;">ข้ามจุดนี้ — ไม่บังคับกรอก ไม่นับเป็นรายการตรวจ</div>
          ` : `
            <div class="toggle-group cl-staff-toggle">
              <button class="${staff.adequate==='ครบ'?'active':''}" onclick="setStepStaff('${step.id}','adequate','ครบ')">ครบ</button>
              <button class="${staff.adequate==='ไม่ครบ'?'active':''}" onclick="setStepStaff('${step.id}','adequate','ไม่ครบ')">ไม่ครบ</button>
            </div>
            ${staff.adequate==='ไม่ครบ' ? `<div style="font-size:8px;color:var(--text-dim);margin-top:3px;">จำนวนที่พบ</div><input type="number" min="0" placeholder="คน" class="cl-staffcount-input" value="${escapeHtml(staff.count)}" oninput="setStepStaff('${step.id}','count',this.value)">` : ''}
          `}
        </td>` : ''}
      <td class="cl-sample">${escapeHtml(s.label)}${renderPointFields(step.id, key, entry)}</td>
      <td>${qtyCell}</td>
      ${bones.map(b=>{
        const bEsc = b.replace(/'/g,"\\'");
        return noProd
          ? `<td><span class="cl-noprod-dash">—</span></td>`
          : `<td><div class="cl-stepper">
          <button type="button" class="cl-step-btn" onclick="stepBoneInput(this,'${key}','${bEsc}',1)">▲</button>
          <input type="number" min="0" class="cl-bone-input" value="${entry.bones[b]||0}" oninput="setSlotBoneInput('${key}','${bEsc}',this)">
          <button type="button" class="cl-step-btn" onclick="stepBoneInput(this,'${key}','${bEsc}',-1)">▼</button>
        </div></td>`;
      }).join('')}
      <td>${noProd ? `<span class="cl-noprod-dash">—</span>` : `<span class="total-pill cl-total-pill ${total===0?'zero':''}" data-slot-total="${kAttr}">${total}</span>`}</td>
    </tr>
  `;
}
// ช่องกรอกเพิ่มเติมเฉพาะจุด (ต่างจาก field ระดับหัวฟอร์ม) — โผล่เฉพาะจุดที่ระบุไว้เท่านั้น
const TORIDAS_MACHINES = ['R1','R2','R3','R4','L1','L2','L3','L4'];
const POINT_SPEC_ONLY_STEPS = ['bl_s6_09','bl_s6_10','bl_cu_07','bl_cu_08'];                 // เพิ่มเฉพาะ Spec (FG หลังตัดแต่ง) — ต่างจาก Spec RM ของหัวฟอร์ม
const POINT_SPEC_LOT_BELT_STEPS = ['bb_s5_02','bb_s5_04','bb_s5_08'];  // เพิ่ม Spec/Lot/สายพาน เฉพาะจุด (แถวที่ระบุ "สุ่ม Spec/Lot" อยู่แล้ว)
const TORIDAS_MACHINE_STEPS = ['bl_cu_03','bl_cu_04'];                 // เลือกเครื่อง Toridas ที่สุ่ม (เก็บใน rmCode เดิม)
function renderPointFields(stepId, key, entry){
  const kAttr = cssEscape(key);
  if(POINT_SPEC_ONLY_STEPS.includes(stepId)){
    return `<div class="cl-point-field"><label>Spec (FG)</label>
      <input type="text" class="cl-point-input" placeholder="ระบุ Spec" value="${escapeHtml(entry.pointSpec)}" oninput="updateSlot('${key}','pointSpec',this.value)"></div>`;
  }
  if(POINT_SPEC_LOT_BELT_STEPS.includes(stepId)){
    return `
      <div class="cl-point-field"><label>Spec</label>
        <input type="text" class="cl-point-input" placeholder="Spec" value="${escapeHtml(entry.pointSpec)}" oninput="updateSlot('${key}','pointSpec',this.value)"></div>
      <div class="cl-point-field"><label>Lot</label>
        <input type="text" class="cl-point-input" placeholder="Lot" value="${escapeHtml(entry.lot)}" oninput="updateSlot('${key}','lot',this.value)"></div>
      <div class="cl-point-field"><label>สายพาน</label>
        <input type="text" class="cl-point-input" placeholder="สายพาน" value="${escapeHtml(entry.pointBelt)}" oninput="updateSlot('${key}','pointBelt',this.value)"></div>`;
  }
  if(TORIDAS_MACHINE_STEPS.includes(stepId)){
    return `<div class="cl-point-field"><label>เครื่อง Toridas</label>
      <select class="cl-point-input" onchange="updateSlot('${key}','rmCode',this.value)">
        <option value="" ${!entry.rmCode?'selected':''}>—</option>
        ${TORIDAS_MACHINES.map(m=>`<option value="${m}" ${entry.rmCode===m?'selected':''}>${m}</option>`).join('')}
      </select></div>`;
  }
  return '';
}
function setSlotBoneInput(key, bone, el){
  const entry = getEntryByKey(key);
  if(!entry) return;
  const v = Math.max(0, parseInt(el.value, 10) || 0);
  entry.bones[bone] = v;
  el.value = v;
  const totalEl = document.querySelector('[data-slot-total="' + cssEscape(key) + '"]');
  if(totalEl){
    const total = rowTotal(entry.bones);
    totalEl.textContent = total;
    totalEl.classList.toggle('zero', total === 0);
  }
}
function stepBoneInput(btn, key, bone, delta){
  const entry = getEntryByKey(key);
  if(!entry) return;
  const v = Math.max(0, (entry.bones[bone]||0) + delta);
  entry.bones[bone] = v;
  const input = btn.closest('.cl-stepper').querySelector('.cl-bone-input');
  if(input) input.value = v;
  const totalEl = document.querySelector('[data-slot-total="' + cssEscape(key) + '"]');
  if(totalEl){
    const total = rowTotal(entry.bones);
    totalEl.textContent = total;
    totalEl.classList.toggle('zero', total === 0);
  }
}

// ช่องเวลาแบบ OTP (4 กล่องแยก) — อัปเดต state ตรงๆ โดยไม่เรียก render() เต็มหน้า กันโฟกัสหลุดตอนพิมพ์ต่อเนื่อง
function readTimeDigits(){
  return [0,1,2,3].map(i=>{
    const el = document.getElementById('timeDigit'+i);
    return el ? el.value : '';
  }).join('');
}
function handleTimeDigitInput(idx, el){
  el.value = el.value.replace(/[^0-9]/g,'').slice(-1);
  state.header.time = readTimeDigits();
  if(el.value && idx < 3){
    const next = document.getElementById('timeDigit'+(idx+1));
    if(next){ next.focus(); next.select && next.select(); }
  }
}
function handleTimeDigitKeydown(idx, ev){
  if(ev.key === 'Backspace' && !ev.target.value && idx > 0){
    const prev = document.getElementById('timeDigit'+(idx-1));
    if(prev){
      prev.value = '';
      prev.focus();
      state.header.time = readTimeDigits();
    }
  }
}

function updateHeader(field, value){
  state.header[field] = value;
  // เปลี่ยนกะ → รายชื่อผู้บันทึกเป็นคนละชุด ถ้าชื่อเดิมไม่อยู่ในกะใหม่ให้ล้างทิ้ง
  if(field === 'shift'){
    if(!recorderNamesFor(value).includes(state.header.recorderName)) state.header.recorderName = '';
  }
  // Lot/Sub lot ค้างไว้ให้ใช้ต่อได้เฉพาะตอนบันทึกติดต่อกันในวันเดียวกัน/กลุ่มสินค้า/ห้องเดิม
  // พอเปลี่ยนวันที่ หรือ กลุ่มสินค้า หรือ ห้อง → ถือว่าเป็นรอบใหม่ ล้าง Lot/Sub lot อัตโนมัติ กันเผลอเอา Lot เก่าไปใช้ข้ามรอบ
  if(field === 'date' || field === 'productGroup' || field === 'room'){
    state.header.lot = '';
    state.header.subLot = '';
  }
  // เปลี่ยนกลุ่มสินค้า → ห้องเดิมอาจไม่มีในกลุ่มใหม่ ให้เด้งไปห้องแรกที่เลือกได้
  if(field === 'productGroup'){
    const rooms = roomsFor(value);
    if(!rooms.includes(state.header.room)) state.header.room = rooms[0] || '';
  }
  // เปลี่ยนกลุ่มสินค้าหรือห้อง → ชุดสายพาน/checklist ทั้งชุดเปลี่ยนหมด
  if(field === 'room' || field === 'productGroup'){
    const belts = currentBelts();
    if(!belts || !belts.includes(Number(state.header.belt))) state.header.belt = '';
    // ถ้ากรอก checklist ของห้อง/กลุ่มสินค้าเดิมค้างไว้อยู่ → เตือนก่อนล้าง (จุดตรวจ/จุดสุ่มเป็นคนละชุดกัน ใช้ต่อไม่ได้)
    if(checklistHasData()){
      state.alert = {
        title: 'ล้างรายการที่กรอกค้างไว้',
        desc: 'เปลี่ยนกลุ่มสินค้า/ห้องแล้ว checklist เป็นคนละชุดกัน ข้อมูลที่กรอกไว้ในห้องเดิมจึงถูกล้างออก (ถ้ายังไม่ได้กด "บันทึกทั้งหมด")',
        items: []
      };
    }
    state.checklist = {}; state.checklistExtra = {}; state.stepStaff = {}; state.stepNoProduction = {}; state.checklistKey = '';
  }
  render();
}

function checklistHasData(){
  const anyEntry = e => e && !entryIsEmpty(e);
  if(Object.values(state.checklist||{}).some(anyEntry)) return true;
  if(Object.values(state.checklistExtra||{}).some(arr => (arr||[]).some(anyEntry))) return true;
  if(Object.values(state.stepStaff||{}).some(st => st && (st.adequate==='ไม่ครบ' || st.count))) return true;
  if(Object.values(state.stepNoProduction||{}).some(Boolean)) return true;
  return false;
}

// ใช้กับ querySelector เพราะชื่อกระดูก/คีย์เป็นภาษาไทยและมีวงเล็บ/เครื่องหมายคำพูด
function cssEscape(s){ return String(s).replace(/["\\]/g, '\\$&'); }

async function saveAllRows(){
  if(state.saving) return;
  ensureChecklist();

  // 1) ตรวจหัวฟอร์มก่อน — จำนวนกระดูกไม่ตรวจ (ไม่พบกระดูกก็เป็น 0 ได้)
  const issues = headerIssues();
  if(issues.length){
    state.showErrors = true;
    const el = document.getElementById('content');
    if(el) el.scrollTo({ top:0, behavior:'smooth' });
    showAlert(
      'กรอกข้อมูลไม่ครบ',
      'ยังบันทึกไม่ได้ — กรุณากรอกข้อมูลหัวฟอร์มต่อไปนี้ให้ครบก่อน',
      issues.map(i => i.label)
    );
    return;
  }

  // ---- รวบรวมแถวจาก checklist ที่กำลังแสดงอยู่ ----
  // จุดปกติ (ไม่ repeatable) เก็บทุกจุดเสมอ แม้กระดูก=0 (คือผลตรวจ "ผ่าน")
  // จุด repeatable (เช่น รับเข้า Lot) เก็บเฉพาะที่กรอกข้อมูลจริง กันแถวว่างเปล่าปนเข้ามา
  // ห้อง S5 (ทั้ง BB/BL): บันทึกเฉพาะเครื่องจักรที่กำลังเลือกอยู่ — เครื่องอื่นให้ไปเลือกแล้วบันทึกแยกรอบ
  const pg = state.header.productGroup, room = state.header.room;
  const steps = visibleSteps();
  const collected = [];
  steps.forEach(step=>{
    if(isStepNoProduction(step.id)) return; // ข้ามจุดที่วันนี้ไม่มีการผลิต — ไม่บันทึกเป็นรายการ
    const staff = getStepStaff(step.id);
    const samples = step.samples||[];
    if(samples.length===0){
      // ไม่มีจุดสุ่ม/ไม่ตรวจกระดูก แต่ยังต้องบันทึกผลตรวจพนักงานประจำจุด
      collected.push({ step, s: { id:'staff', label:'' }, entry: blankEntry(pg), staff });
      return;
    }
    samples.forEach(s=>{
      const baseKey = slotKey(step.id, s.id);
      const entry = state.checklist[baseKey] || blankEntry(pg);
      if(!s.repeatable || !entryIsEmpty(entry)){
        collected.push({ step, s, entry, staff });
      }
      if(s.repeatable){
        const arrKey = step.id + '::' + s.id;
        (state.checklistExtra[arrKey]||[]).forEach(entry2=>{
          if(!entryIsEmpty(entry2)) collected.push({ step, s, entry: entry2, staff });
        });
      }
    });
  });

  if(collected.length===0){
    const allNoProd = steps.length>0 && steps.every(step=>isStepNoProduction(step.id));
    showAlert(
      'ยังไม่มีข้อมูล',
      allNoProd
        ? 'ทุกจุดตรวจถูกตั้งเป็น "ไม่มีการผลิต" ไม่มีรายการให้บันทึก'
        : 'กรุณากรอกจำนวนสุ่ม หรือจำนวนกระดูกที่พบ อย่างน้อย 1 จุดก่อนบันทึก'
    );
    return;
  }

  // 2) เปิดป๊อบอัพยืนยันก่อนบันทึกจริง — สรุป วันที่/กะ/ห้อง + ยอดรวมกระดูกที่พบ ให้เช็คก่อนกดยืนยัน
  const totalBones = collected.reduce((a,c)=>a + rowTotal(c.entry.bones), 0);
  state.confirmSave = {
    collected,
    header: Object.assign({}, state.header),
    count: collected.length,
    totalBones
  };
  render();
}

function cancelSaveConfirm(){
  state.confirmSave = null;
  render();
}

async function confirmAndSave(){
  const pending = state.confirmSave;
  if(!pending || state.saving) return;
  state.confirmSave = null;
  state.saving = true; render();
  const h = pending.header;
  const now = Date.now();
  const nowTime = formatHHMM(h.time) || nowTimeStr();   // เวลาที่กรอกเอง (HHMM) แปลงเป็น HH:MM — ถ้าไม่กรอกไว้ ใช้เวลาจริง ณ ตอนกดบันทึก
  const newRecs = pending.collected.map(({step, s, entry, staff})=>({
    id: uid(),
    date: h.date, time: nowTime, room: h.room, shift: h.shift, recorderName: h.recorderName||'',
    productGroup: h.productGroup,
    sourceType: h.sourceType, sourceDetail: h.sourceType==='ซื้อ' ? h.sourceDetail : '',
    stdLineId: step.id, stdLine: step.stdLine,
    samplePointId: s.id, samplePoint: s.label,
    rmBelt: entry.rmCode||'', weight: entry.weight||'',
    belt: h.belt, staffAdequate: staff.adequate, staffCount: staff.adequate==='ไม่ครบ' ? String(staff.count||'').trim() : '',
    lot: entry.lot || h.lot, subLot: h.subLot||'', spec: h.spec,
    pointSpec: entry.pointSpec||'', pointBelt: entry.pointBelt||'',
    sampleType: '', sampleQty: String(entry.qty||'').trim() || (s.qty!=null ? String(s.qty) : ''),
    bones: entry.bones, total: rowTotal(entry.bones),
    createdAt: now
  }));

  try{
    await loadRecords();                       // ดึงของล่าสุด กันชนกับคนอื่น
    const merged = state.records.concat(newRecs);
    await persistRecords(merged);              // เขียนให้สำเร็จก่อน
    state.records = merged;                    // แล้วค่อยอัปเดตในหน่วยความจำ
    await persistLastHeader();
    // เคลียร์ checklist รอบนี้ทิ้ง พร้อมสำหรับรอบตรวจถัดไป
    state.checklist = {}; state.checklistExtra = {}; state.stepStaff = {}; state.stepNoProduction = {}; state.checklistKey = '';
    state.showErrors = false;
    // Lot/Sub lot "ไม่" ล้างตรงนี้โดยตั้งใจ — ให้ค้างไว้ใช้ต่อได้ถ้าบันทึกติดต่อกันในวันเดียวกัน/กลุ่มสินค้า/ห้องเดิม
    // (จะถูกล้างอัตโนมัติทันทีที่เปลี่ยนวันที่/กลุ่มสินค้า/ห้อง ดู updateHeader)
    showToast('บันทึกเรียบร้อย ' + newRecs.length + ' รายการ (รวมทั้งหมด ' + merged.length + ')', 'success');
  }catch(err){
    console.error('save failed:', err);
    state.alert = {
      title: 'บันทึกไม่สำเร็จ',
      desc: 'รายการที่กรอกไว้ยังอยู่ครบ กด "บันทึกทั้งหมด" ใหม่ได้เลย',
      items: [err && err.message ? err.message : 'storage error']
    };
  }finally{
    state.saving = false;                      // ไม่ว่าจะสำเร็จหรือไม่ ปุ่มต้องกลับมากดได้
    render();
  }
}

// ---------- HISTORY TAB ----------
function filteredRecords(){
  const f = state.filters;
  return state.records.filter(r=>{
    if(f.from && r.date < f.from) return false;
    if(f.to && r.date > f.to) return false;
    if(f.productGroup!=='ALL' && r.productGroup!==f.productGroup) return false;
    if(f.room!=='ALL' && r.room!==f.room) return false;
    if(f.search){
      const s = f.search.toLowerCase();
      const hay = (r.lot+' '+(r.subLot||'')+' '+r.stdLine+' '+(r.samplePoint||'')).toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
}

const HISTORY_DEFAULT_LIMIT = 100; // ไม่เลือกช่วงวันที่ → โชว์แค่ 100 รายการล่าสุด กันเครื่องค้างเมื่อข้อมูลสะสมเยอะ

function renderHistoryTab(){
  const allRecs = filteredRecords();
  const hasDateFilter = !!(state.filters.from || state.filters.to);
  const recs = hasDateFilter ? allRecs : allRecs.slice(0, HISTORY_DEFAULT_LIMIT);
  const isCapped = !hasDateFilter && allRecs.length > HISTORY_DEFAULT_LIMIT;
  const rooms = Array.from(new Set(state.records.map(r=>r.room))).filter(Boolean);
  const grouped = {};
  recs.forEach(r=>{ (grouped[r.date] = grouped[r.date]||[]).push(r); });
  const dates = Object.keys(grouped).sort().reverse();

  return `
    ${STORAGE_MODE==='cloud'
      ? `<div class="banner-shared">ข้อมูลนี้เก็บแบบ<strong>ส่วนกลาง</strong> — พนักงาน QC ทุกคนที่เปิดแอพนี้จะเห็นและบันทึกร่วมกันได้</div>`
      : `<div class="banner-shared banner-local">ขณะนี้เก็บข้อมูลไว้ใน<strong>เครื่องนี้เท่านั้น</strong> (localStorage) — เครื่องอื่นจะไม่เห็นข้อมูลชุดนี้ อย่าลืมส่งออก Excel เป็นระยะ</div>`}
    <div class="filter-bar">
      <div class="field-row">
        <div><label>จากวันที่</label><input type="date" value="${state.filters.from}" onchange="updateFilter('from',this.value)"></div>
        <div><label>ถึงวันที่</label><input type="date" value="${state.filters.to}" onchange="updateFilter('to',this.value)"></div>
      </div>
      <label>กลุ่มสินค้า</label>
      <div class="chip-row">
        <span class="chip ${state.filters.productGroup==='ALL'?'active':''}" onclick="updateFilter('productGroup','ALL')">ทั้งหมด</span>
        <span class="chip ${state.filters.productGroup==='BL'?'active':''}" onclick="updateFilter('productGroup','BL')">BL</span>
        <span class="chip ${state.filters.productGroup==='BB'?'active':''}" onclick="updateFilter('productGroup','BB')">BB</span>
      </div>
      <label>ห้อง</label>
      <div class="chip-row">
        <span class="chip ${state.filters.room==='ALL'?'active':''}" onclick="updateFilter('room','ALL')">ทั้งหมด</span>
        ${rooms.map(r=>`<span class="chip ${state.filters.room===r?'active':''}" onclick="updateFilter('room','${r}')">${escapeHtml(r)}</span>`).join('')}
      </div>
      <input type="text" placeholder="ค้นหา Lot / Sub lot / จุดตรวจ / จุดสุ่ม" value="${escapeHtml(state.filters.search)}" oninput="state.filters.search=this.value; render();" style="margin-bottom:0;">
    </div>

    <div class="stat-grid">
      <div class="stat-box"><div class="num">${allRecs.length}</div><div class="lbl">รายการ</div></div>
      <div class="stat-box"><div class="num">${allRecs.reduce((a,r)=>a+r.total,0)}</div><div class="lbl">พบกระดูก (ชิ้น)</div></div>
      <div class="stat-box"><div class="num">${allRecs.length? (allRecs.reduce((a,r)=>a+r.total,0)/allRecs.length).toFixed(1):'0'}</div><div class="lbl">เฉลี่ย/รายการ</div></div>
    </div>

    <button class="btn btn-primary" style="margin-bottom:4px;" onclick="exportExcel()">⬇ ส่งออก Excel (${allRecs.length} รายการ)</button>
    ${isCapped ? `<div class="helptext" style="margin:6px 0 10px;">แสดง ${HISTORY_DEFAULT_LIMIT} รายการล่าสุดจากทั้งหมด ${allRecs.length} รายการที่ตรงเงื่อนไข — เลือกช่วง "จากวันที่ / ถึงวันที่" ด้านบนเพื่อดึงข้อมูลเก่ากว่านี้มาดูทั้งหมด (เหมือนตอนส่งออก Excel)</div>` : ''}

    ${dates.length===0 ? `
      <div class="empty-state"><div class="big">📋</div><div class="msg">ไม่พบข้อมูลตามเงื่อนไขที่กรอง</div></div>
    ` : dates.map(date=>`
      <div class="history-date-head">${fmtDateTh(date)}</div>
      ${grouped[date].map(r=>`
        <div class="card ticket hist-card" onclick="toggleHistory('${r.id}')">
          <span class="hole-r"></span>
          <div class="row-summary">
            <div>
              <div class="name">${escapeHtml(r.stdLine||'(ไม่ระบุ Std line)')}</div>
              ${r.samplePoint?`<div class="meta" style="color:var(--steel);font-weight:600;">${escapeHtml(r.samplePoint)}</div>`:''}
              <div class="meta">${escapeHtml(r.room)}${r.belt?' · สายพาน '+r.belt:''}${r.rmBelt?' · RM '+escapeHtml(r.rmBelt):''} · ${escapeHtml(r.shift)}${r.recorderName?' · '+escapeHtml(r.recorderName):''}${r.time?' · '+escapeHtml(r.time):''} · ${PRODUCT_LABEL[r.productGroup]?.split(' ')[0]||r.productGroup} · Lot ${escapeHtml(r.lot||'-')}${r.staffAdequate==='ไม่ครบ'?' · ⚠ พนักงานไม่ครบ ('+escapeHtml(r.staffCount||'-')+' คน)':''}</div>
            </div>
            <span class="total-pill ${r.total===0?'zero':''}">${r.total===0?'ผ่าน':'พบ '+r.total}</span>
          </div>
          <div class="hist-detail ${state.openHistoryId===r.id?'open':''}">
            <div class="bone-detail-grid">
              ${Object.entries(r.bones||{}).map(([k,v])=>`<div>${escapeHtml(k)}</div><div class="bv ${v>0?'pos':''}">${v}</div>`).join('')}
            </div>
            <div class="meta" style="margin-bottom:8px;">Spec ${escapeHtml(r.spec||'-')} · สุ่ม ${escapeHtml(r.sampleQty||'-')}${r.subLot?(' · Sub lot '+escapeHtml(r.subLot)):''}${r.weight?(' · รับเข้า '+escapeHtml(r.weight)+' kg'):''} · แหล่งเนื้อ ${escapeHtml(r.sourceType||'-')}${r.sourceDetail?(' ('+escapeHtml(r.sourceDetail)+')'):''}${r.pointSpec?(' · Spec จุดสุ่ม '+escapeHtml(r.pointSpec)):''}${r.pointBelt?(' · สายพานจุดสุ่ม '+escapeHtml(r.pointBelt)):''}</div>
            <button class="btn btn-danger-ghost" onclick="event.stopPropagation(); deleteRecord('${r.id}')">ลบรายการนี้</button>
          </div>
        </div>
      `).join('')}
    `).join('')}
  `;
}

function updateFilter(field, value){ state.filters[field]=value; render(); }
function toggleHistory(id){ state.openHistoryId = state.openHistoryId===id ? null : id; render(); }

async function deleteRecord(id){
  if(!confirm('ยืนยันลบรายการนี้?')) return;
  try{
    await loadRecords();
    const remaining = state.records.filter(r=>r.id!==id);
    await persistRecords(remaining);
    state.records = remaining;
    showToast('ลบรายการแล้ว');
  }catch(err){
    console.error('delete failed:', err);
    showToast('ลบไม่สำเร็จ: ' + (err && err.message ? err.message : 'storage error'));
  }
  render();
}

function exportExcel(){
  const recs = filteredRecords();
  if(recs.length===0){ showToast('ไม่มีข้อมูลให้ส่งออก'); return; }
  const wb = XLSX.utils.book_new();
  ['BL','BB'].forEach(pg=>{
    const rows = recs.filter(r=>r.productGroup===pg);
    if(rows.length===0) return;
    const boneCols = BONE_TYPES[pg];
    const data = rows.map(r=>{
      const base = {
        'วันที่': fmtDateTh(r.date), 'สายพาน': r.belt||'', 'ห้อง': r.room,
        'แหล่งเนื้อ': r.sourceType + (r.sourceDetail?(' ('+r.sourceDetail+')'):''),
        'Std line': r.stdLine, 'สุ่ม': r.samplePoint||'',
        'Spec': r.spec, 'Lot': r.lot, 'Sub lot': r.subLot||'',
        'Spec (จุดสุ่ม)': r.pointSpec||'', 'สายพาน (จุดสุ่ม)': r.pointBelt||'',
        'สายพาน RM': r.rmBelt||'', 'น้ำหนักรับเข้า (kg)': r.weight||'',
        'จำนวนสุ่ม': sampleQtyNumber(r.sampleQty), 'หน่วยสุ่ม': sampleQtyUnit(r.sampleQty),
        'เวลา (กะ)': r.shift, 'เวลาบันทึก': r.time||'', 'ผู้บันทึก': r.recorderName||'',
        'พนักงานประจำจุด': r.staffAdequate||'', 'จำนวนคนที่อยู่จริง (ถ้าไม่ครบ)': r.staffCount||''
      };
      boneCols.forEach(b=>{ base[b] = r.bones && r.bones[b] ? r.bones[b] : 0; });
      base['รวม'] = r.total;
      return base;
    });
    const ws = XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, pg);
  });
  XLSX.writeFile(wb, 'bone_inspection_' + todayStr() + '.xlsx');
  showToast('ส่งออกไฟล์ Excel แล้ว');
}

// ---------- TREND TAB ----------
function renderTrendTab(){
  const rooms = Array.from(new Set(state.records.filter(r=>r.productGroup===state.trend.productGroup).map(r=>r.room))).filter(Boolean);
  return `
    <div class="filter-bar">
      <label>กลุ่มสินค้า</label>
      <div class="toggle-group">
        <button class="${state.trend.productGroup==='BL'?'active':''}" onclick="updateTrend('productGroup','BL')">BL</button>
        <button class="${state.trend.productGroup==='BB'?'active':''}" onclick="updateTrend('productGroup','BB')">BB</button>
      </div>
      <label>ห้อง</label>
      <div class="chip-row">
        <span class="chip ${state.trend.room==='ALL'?'active':''}" onclick="updateTrend('room','ALL')">ทั้งหมด</span>
        ${rooms.map(r=>`<span class="chip ${state.trend.room===r?'active':''}" onclick="updateTrend('room','${r}')">${escapeHtml(r)}</span>`).join('')}
      </div>
      <div class="field-row" style="margin-bottom:0;">
        <div><label>จากวันที่</label><input type="date" value="${state.trend.from}" onchange="updateTrend('from',this.value)"></div>
        <div><label>ถึงวันที่</label><input type="date" value="${state.trend.to}" onchange="updateTrend('to',this.value)"></div>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="trendCanvas" height="220"></canvas></div>
    <div id="trendStats"></div>
  `;
}

function updateTrend(field,value){ state.trend[field]=value; render(); }

function trendData(){
  const t = state.trend;
  const recs = state.records.filter(r=>{
    if(r.productGroup!==t.productGroup) return false;
    if(t.room!=='ALL' && r.room!==t.room) return false;
    if(t.from && r.date<t.from) return false;
    if(t.to && r.date>t.to) return false;
    return true;
  });
  const byDate = {};
  recs.forEach(r=>{ byDate[r.date] = (byDate[r.date]||0) + r.total; });
  const dates = Object.keys(byDate).sort();
  return { dates, totals: dates.map(d=>byDate[d]), recs };
}

function drawTrendChart(){
  const canvas = document.getElementById('trendCanvas');
  if(!canvas) return;
  const { dates, totals, recs } = trendData();
  if(state.chartInstance){ state.chartInstance.destroy(); }
  if(dates.length===0){
    canvas.parentElement.innerHTML = '<div class="empty-state"><div class="big">📈</div><div class="msg">ยังไม่มีข้อมูลตามเงื่อนไขที่เลือก</div></div>';
  } else {
    state.chartInstance = new Chart(canvas.getContext('2d'), {
      type:'line',
      data:{
        labels: dates.map(fmtDateTh),
        datasets:[{
          label:'จำนวนกระดูกที่พบ (ชิ้น/วัน)',
          data: totals,
          borderColor:'#D68A34',
          backgroundColor:'rgba(214,138,52,0.15)',
          tension:0.25,
          fill:true,
          pointBackgroundColor:'#20303B',
          pointRadius:4
        }]
      },
      options:{
        responsive:true,
        plugins:{ legend:{display:false} },
        scales:{
          y:{ beginAtZero:true, ticks:{ precision:0 } },
          x:{ ticks:{ maxRotation:45, minRotation:45, font:{size:10} } }
        }
      }
    });
  }
  const total = totals.reduce((a,b)=>a+b,0);
  const avg = dates.length ? (total/dates.length).toFixed(1) : '0';
  const max = dates.length ? Math.max(...totals) : 0;
  document.getElementById('trendStats').innerHTML = `
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${recs.length}</div><div class="lbl">รายการตรวจ</div></div>
      <div class="stat-box"><div class="num">${total}</div><div class="lbl">รวมพบ (ชิ้น)</div></div>
      <div class="stat-box"><div class="num">${avg}</div><div class="lbl">เฉลี่ย/วัน</div></div>
    </div>
  `;
}

loadState();
</script>
